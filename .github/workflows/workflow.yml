name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

jobs:
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci --force
      - run: npm run lint:frontend

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci --force
      - run: npm run lint:backend

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci --force
      - run: npm run neon:migrate:deploy; npm run neon:generate; npm run build
